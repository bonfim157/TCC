# Checagens do PR: build, contraste e testes do servidor (minutos).
# Os roteiros de navegador (~20 min) não rodam a cada PR: rodam à noite e quando alguém dispara.
# Não há gatilho de push: a main só recebe código que já passou no PR.
name: Verificação

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (checagem de tipos e pacote de produção)
        run: npm run build

      - name: Contraste WCAG AA
        run: npm run contrast

      - name: Testes do servidor
        run: npm test --if-present

  roteiros:
    # Só à noite e sob demanda, nunca no PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Navegador dos roteiros
        run: npx playwright install --with-deps chromium

      - name: Roteiros no navegador, com a API simulada (F1 a F5)
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
          npm run verificar
          pkill -f vite || true

      - name: Roteiros no navegador, contra o servidor real (banco local)
        run: |
          npm run dev:servidor > servidor.log 2>&1 &
          VITE_API=real npm run dev > dev-real.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:5173/api/saude && break
            sleep 1
          done
          npm run verificar

      - name: Capturas de tela em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: front/output/verificacao/
          if-no-files-found: ignore
